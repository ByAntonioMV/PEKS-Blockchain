<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión Web3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'peks-blue': '#1e40af',
                        'peks-light-blue': '#3b82f6',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-white flex items-center justify-center p-4">
    <div class="w-full max-w-md">

        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-full mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.031 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-blue-800 mb-2">PEKS Blockchain</h1>
            <p class="text-blue-600 font-medium">Información segura</p>
        </div>

        
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-blue-100">
            <h2 class="text-2xl font-semibold text-gray-800 text-center mb-6">Conecta tu Wallet</h2>
            
            <div class="space-y-6">
                <p class="text-center text-gray-600">
                    Para iniciar sesión, por favor conecta tu billetera de Ethereum. Esto verifica tu identidad en la plataforma de forma segura.
                </p>
                
                <button 
                    id="connectButton"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 flex items-center justify-center space-x-2"
                >
                    <img src="https://upload.wikimedia.org/wikipedia/commons/3/36/MetaMask_Fox.svg" alt="MetaMask" class="w-6 h-6">
                    <span>Conectar con MetaMask</span>
                </button>
            </div>

            <div id="message" class="mt-4 text-center text-sm font-medium"></div>
        </div>
    </div>

    <script>
        const connectButton = document.getElementById('connectButton');
        const messageDiv = document.getElementById('message');

        connectButton.addEventListener('click', async () => {
            if (typeof window.ethereum === 'undefined') {
                messageDiv.textContent = "Error: MetaMask no está instalado.";
                return;
            }

            try {
                messageDiv.textContent = "Conectando y verificando...";
                
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = provider.getSigner();
                const userAddress = await signer.getAddress();
                
                const response = await fetch('/api/autenticar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userAddress: userAddress }),
                });

                const result = await response.json();

                // --- CORRECCIÓN AQUÍ ---
                // Usamos un switch para manejar todos los roles posibles
                if (result.success && result.redirectUrl) {
                    messageDiv.textContent = `¡Bienvenido, ${result.role}! Redirigiendo...`;
                    messageDiv.className = "text-green-500";
                    window.location.href = result.redirectUrl;
                } else {
                    messageDiv.textContent = result.message || "Esta cuenta no está registrada.";
                    messageDiv.className = "text-yellow-600";
                }

            } catch (error) {
                console.error("Error en el proceso de autenticación:", error);
                messageDiv.textContent = "Ocurrió un error. Revisa la consola.";
                messageDiv.className = "text-red-500";
            }
        });
    </script>
</body>
</html>
